<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Screen</title>
    <link rel="stylesheet" href="./interview.css">
</head>
<body>
    <div class="right">

        <div class="interview-section">

            <!-- HEADER -->
            <div class="interview-header">
                <h1>AI Mock Interview</h1>
            </div>

            <div class="QnA-Box">
            <h2>Question</h2>
            <div id="questionBox" class="card">
                <div id="question">Click Start Interview</div>
            </div>

            <!-- ANSWER -->
            <h2 class="AnswerBox">Answer</h2>
            <div id="AnswerBox" class="card">
                <div id="Answer">Your Answer Here</div>

                <!-- waveform -->
                <div class="waveform" id="waveform"></div>
            </div>
            </div>

            <!-- VIDEO SECTION -->
            <div class="video-section">

                <!-- AI VIDEO -->
                <div class="ai-video">
                    <video src="./assets/male-ai.mp4" muted autoplay loop width="1000px" height="900px" style="position: relative; top: -210px; left:-100px;"></video>
                    <span class="ai-status">AI Speaking</span>
                </div>

                <!-- USER VIDEO -->
                <div class="user-video">
                    <img id="videoStream" style="width: 245px; height: 245px;">
                    <span class="recording">● Recording</span>
                </div>

            </div>

            <!-- FEEDBACK -->
            <h2 style="position: relative; top: -190px; font-size: 42px;">Feedback</h2>

            <div id="feedback" class="card"></div>

            <!-- EXTRA VISUAL FEEDBACK (SAFE ADDITION) -->
            <!-- <div class="feedback-cards" style="position: relative; top: -170px; font-size: 20px;">

                <div class="feedback-card good">
                    <h4>Strength</h4>
                    <p>Clear explanation</p>
                </div>

                <div class="feedback-card improve">
                    <h4>Improve</h4>
                    <p>Reduce filler words</p>
                </div>

                <div class="feedback-card score">
                    <h4>Score</h4>
                    <p>--</p>
                </div> -->

            </div>

        

    <!-- ================= ACTION BUTTONS ================= -->
<div class="interview-actions" style="position: relative; top: -170px; font-size: 20px;">

    <button id="startInterview">
        <i class="fa-solid fa-play"></i> Start
    </button>

    <button id="startBtn">
        <i class="fa-solid fa-microphone"></i> Start Speaking
    </button>

    <button id="stopBtn">
        <i class="fa-solid fa-stop"></i> Stop Speaking
    </button>

    <button id="submitAnswer">
        <i class="fa-solid fa-paper-plane"></i> Submit Answer
    </button>

    <button id="nextquestion">
        <i class="fa-solid fa-forward"></i> Next Question
    </button>

    <button id="video">
        <i class="fa-solid fa-video"></i> Start Video
    </button>

    <button id="stopVideo">
        <i class="fa-solid fa-video-slash"></i> Stop Video
    </button>

    <a href="http://localhost:4000/download-report"><button id="report"> Generate Report
    </button></a>

</div>
</div>

    </div>

    <script src="./script.js"></script>

</body>
</html>
