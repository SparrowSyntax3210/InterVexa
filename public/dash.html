<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Interview Dashboard</title>
<link rel="stylesheet" href="dash.css">
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <div class="logo">InterVexa</div>

  <div class="menu">
    <div class="active">Dashboard</div>
    <div>Interviews</div>
    <div>HomePage</div>
  </div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

  <div class="header">
    <h1>Welcome back, Harsh </h1>
    <span>This Week</span>
  </div>

  <!-- CARDS -->
  <div class="cards">
    <div class="card">
      <small>Overall Score</small>
      <h2>87%</h2>
      <small style="color:#00ff99;">Excellent</small>
    </div>

    <div class="card">
      <small>Interviews</small>
      <h2>12</h2>
      <small style="color:#00ff99;">+20%</small>
    </div>

    <div class="card">
      <small>Avg Score</small>
      <h2>84%</h2>
      <small style="color:#00ff99;">+15%</small>
    </div>

    <div class="card">
      <small>Best Score</small>
      <h2>92%</h2>
      <small style="color:#00ff99;">Excellent</small>
    </div>
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- CHART -->
    <div class="chart">
      <h3>Performance Trend</h3>
      <div class="line"></div>
    </div>

    <!-- SESSIONS -->
    <div class="sessions">
      <h3>Recent Sessions</h3>

      <div class="session">
        <span>Technical Interview</span>
        <span class="tag">85%</span>
      </div>

      <div class="session">
        <span>HR Interview</span>
        <span class="tag">90%</span>
      </div>

      <div class="session">
        <span>Behavioral Interview</span>
        <span class="tag">80%</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
