<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background">
    <div class="stars"></div>
    <div class="beam"></div>

    <div class="card">
      <h2>Sign up</h2>
      <p class="subtitle">Start your 7-day free trial.</p>

      <form>
        <div class="input-group">
          <input type="text" required>
          <label>Name*</label>
        </div>

        <div class="input-group">
          <input type="email" required>
          <label>Email*</label>
        </div>

        <div class="input-group">
          <input type="password" required>
          <label>Password*</label>
        </div>
        <small>Must be at least 9 characters.</small>

        <button class="primary-btn">Create account</button>
      </form>

      <div class="divider">OR</div>

      <div class="social-buttons">
        <button class="google">Sign up with Google</button>
        <button class="apple">Sign up with Apple</button>
      </div>
    </div>
  </div>
</body>
</html>
